name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Tesseract OCR (Serbian, German, English)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends tesseract-ocr             tesseract-ocr-srp tesseract-ocr-srp-latn tesseract-ocr-deu tesseract-ocr-eng

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Check the server deploy files (ADR-040)
        run: |
          cp deploy/server/.env.example deploy/server/.env
          docker compose -f deploy/server/compose.yaml config -q
          docker run --rm -v "$PWD/deploy/server/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e DOMAIN=asistent.example.com -e N8N_DOMAIN=n8n.example.com -e ACME_EMAIL=it@example.com \
            -e AUTH_USER=firma -e 'AUTH_PASSWORD_HASH=$2a$14$Zkx19XLiW6VYouLHR5NmfOFU0z2GTNmpkT/5qqR7hx4IjWJPDhjvG' \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Tests
        run: uv run pytest
