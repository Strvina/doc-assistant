# docker compose up --build                 → http://localhost:8000 (web UI), /docs (API)
# docker compose --profile automation up    → also n8n on http://localhost:5678
services:
  app:
    build: .
    env_file:
      - path: .env
        required: false  # docker compose works before .env exists
    ports: ["8000:8000"]
    volumes:
      - state:/state  # index, original documents, query log, outbox

  n8n:
    profiles: ["automation"]
    image: docker.n8n.io/n8nio/n8n
    ports: ["5678:5678"]
    volumes:
      - n8n:/home/node/.n8n

volumes:
  state:
  n8n:
