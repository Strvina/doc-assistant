# docker compose up            → UI on http://localhost:8501, API on http://localhost:8000/docs
# docker compose --profile automation up   → also n8n (http://localhost:5678) and
#                                            Mailpit, a local inbox for test e-mails (http://localhost:8025)
services:
  ui:
    build: .
    env_file:
      - path: .env
        required: false  # docker compose works before .env exists
    ports: ["8501:8501"]
    volumes:
      - state:/state
      - uploads:/app/data/uploads

  api:
    build: .
    env_file:
      - path: .env
        required: false  # docker compose works before .env exists
    command: ["uvicorn", "docassist.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    # Shares the index with the UI. Chroma's embedded mode is meant for one process; for real
    # concurrent use run a Chroma server or Postgres + pgvector (see ADR-003).
    volumes:
      - state:/state

  n8n:
    profiles: ["automation"]
    image: docker.n8n.io/n8nio/n8n
    ports: ["5678:5678"]
    environment:
      GENERIC_TIMEZONE: Europe/Belgrade
      TZ: Europe/Belgrade
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"  # plain http on localhost
    volumes:
      - n8n:/home/node/.n8n
      - ./automations:/automations:ro

  # Catches every e-mail n8n sends; view them at http://localhost:8025 (nothing leaves the PC).
  mailpit:
    profiles: ["automation"]
    image: axllent/mailpit
    ports: ["8025:8025"]

volumes:
  state:
  uploads:
  n8n:
