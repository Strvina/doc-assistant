# docker compose up --build                 → http://localhost:8000 (web UI), /docs (API)
# docker compose --profile automation up    → also n8n (http://localhost:5678) and
#                                             Mailpit, a local inbox for test e-mails (http://localhost:8025)
services:
  app:
    build: .
    env_file:
      - path: .env
        required: false  # docker compose works before .env exists
    ports: ["8000:8000"]
    volumes:
      - state:/state  # index, original documents, query log, outbox

  n8n:
    profiles: ["automation"]
    image: docker.n8n.io/n8nio/n8n
    ports: ["5678:5678"]
    environment:
      GENERIC_TIMEZONE: Europe/Belgrade
      TZ: Europe/Belgrade
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"  # plain http on localhost
      # The weekly gap report workflow reads these (ADR-035). The app on this PC is reached as
      # host.docker.internal; when it also runs in compose, use http://app:8000.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      DOC_ASSISTANT_URL: ${DOC_ASSISTANT_URL:-http://host.docker.internal:8000}
      DOC_ASSISTANT_API_KEY: ${API_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux; Docker Desktop has it already
    volumes:
      - n8n:/home/node/.n8n
      - ./automations:/automations:ro

  # Catches every e-mail n8n sends; view them at http://localhost:8025 (nothing leaves the PC).
  mailpit:
    profiles: ["automation"]
    image: axllent/mailpit
    ports: ["8025:8025"]

volumes:
  state:
  n8n:
