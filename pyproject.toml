[project]
name = "docassist"
version = "0.1.0"
description = "Internal AI assistant that answers questions from company documents with citations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4.0",
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "openai>=3.44.0",
    "openpyxl>=3.1.5",
    "pymupdf>=1.28.2,<2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-openpyxl>=3.1.5.20261017",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docassist"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, comprehensions, misc. lints,
# return values, ruff's own rules, performance, pathlib, pylint errors and warnings.
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "RUF", "PERF", "PTH", "PLE", "PLW"]
# The documents and answers are in Serbian and German: their letters are not "ambiguous".
ignore = ["RUF001", "RUF002", "RUF003"]
# `rect + (56, 56, -56, -56)` moves the edges of a PyMuPDF Rect; it is not tuple concatenation.
extend-ignore = ["RUF005"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
strict_equality = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
